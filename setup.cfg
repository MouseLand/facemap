[aliases]
test=pytest

[isort]
profile=black

[flake8]
max-line-length=88
extend-ignore=E203
per-file-ignores =
    */__init__.py: F401, F403
    

[codespell]
# Ref: https://github.com/codespell-project/codespell#using-a-config-file
skip = .git*
check-hidden = true
ignore-regex = ^\s*"image/\S+": ".*|.{300,}|\bTung\b
# some unfortunate names of variables
ignore-words-list = dout,nd,gaus,dum,gaus'
